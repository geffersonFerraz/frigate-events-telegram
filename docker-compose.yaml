services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - frigate-events-network
  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - frigate-events-network

networks:
  frigate-events-network:
    driver: bridge